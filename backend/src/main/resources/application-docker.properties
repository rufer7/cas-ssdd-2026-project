spring.datasource.url=jdbc:postgresql://db:5432/app
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=never

# H2 console disabled to reduce attack surface.
spring.h2.console.enabled=false

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# Auth0 OIDC resource server settings (injected via environment variables)
auth0.domain=${AUTH0_DOMAIN}
auth0.audience=${AUTH0_AUDIENCE}
auth0.issuer-uri=https://${AUTH0_DOMAIN}/
auth0.roles-claim=${AUTH0_ROLES_CLAIM:https://dummy-audience/roles}