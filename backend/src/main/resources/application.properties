spring.application.name=eventhub
spring.profiles.default=local
server.port=8080

# Microsoft Entra ID (OIDC) integration.
# The starter spring-cloud-azure-starter-active-directory auto-configures a JwtDecoder
# and a JwtAuthenticationConverter that maps Entra ID app roles to APPROLE_* authorities.
# Values are sourced from environment variables and should be provided per environment.
spring.cloud.azure.active-directory.enabled=${ENTRA_ID_ENABLED:true}
spring.cloud.azure.active-directory.profile.tenant-id=${ENTRA_ID_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${ENTRA_ID_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${ENTRA_ID_CLIENT_SECRET:}
spring.cloud.azure.active-directory.app-id-uri=${ENTRA_ID_APP_ID_URI:}