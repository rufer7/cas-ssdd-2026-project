# Datasource Settings
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

# SQL Initialization Settings
spring.sql.init.mode=never

# H2 Console Settings
spring.h2.console.enabled=true

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# do not run docker for local config
spring.docker.compose.enabled=false

# Microsoft Entra ID integration is disabled by default in local development so that
# the application can be started without configuring an Entra ID tenant. Override the
# ENTRA_ID_* environment variables and set ENTRA_ID_ENABLED=true to test it locally.
spring.cloud.azure.active-directory.enabled=${ENTRA_ID_ENABLED:false}


