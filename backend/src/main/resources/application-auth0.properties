# Datasource Settings
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

# SQL Initialization Settings
spring.sql.init.mode=never

# H2 Console Settings — disabled outside local development to reduce attack surface.
spring.h2.console.enabled=false

# Flyway Settings
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# do not run docker for auth0 config
spring.docker.compose.enabled=false

# Auth0 OIDC resource server settings.
# Real values are injected via environment variables; the defaults keep the
# profile bootable offline (e.g. in tests/CI) where the tenant is unreachable.
auth0.domain=${AUTH0_DOMAIN:dummy-tenant.eu.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://dummy-audience.ch}
auth0.issuer-uri=https://${auth0.domain}/
# Namespaced custom claim that carries the application roles (set via an Auth0 Login Action).
auth0.roles-claim=${AUTH0_ROLES_CLAIM:https://dummy-audience/roles}