name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [created]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  buildTestAndAnalyze:
    name: Build, test and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Java 25
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Cache SonarQube packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        env:
          # SPA config baked at build time. Auth0 SPA settings are public (not secrets);
          # the empty API base URL makes the app call the same origin that serves it.
          VITE_AUTH_MODE: auth0
          VITE_API_BASE_URL: ""
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run build

      - name: Bundle frontend into backend static resources
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/. backend/src/main/resources/static/

      - name: Gradle Build
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :backend:build :backend:sonar --info

      - name: Publish test report
        uses: dorny/test-reporter@v3.0.0
        if: |
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: JUnit Tests
          path: backend/build/test-results/test/*.xml
          reporter: java-junit

  trigger-deployment:
    name: Trigger Deployment to Render.com
    runs-on: ubuntu-latest
    environment: Lab
    needs: buildTestAndAnalyze
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Call deployment hook on Render.com
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOYMENT_HOOK_URL }}
        run: |
          curl --fail-with-body -X POST "$deploy_url"
