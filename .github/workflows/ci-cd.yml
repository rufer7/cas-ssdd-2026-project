name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [created]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  buildTestAndAnalyze:
    name: Build, test and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Java 25
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Cache SonarQube packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Gradle Build
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar --info

      - name: Publish test report
        uses: dorny/test-reporter@v3.0.0
        if: |
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: JUnit Tests
          path: backend/build/test-results/test/*.xml
          reporter: java-junit

  trigger-deployment:
    name: Trigger Deployment to Render.com
    runs-on: ubuntu-latest
    environment: Lab
    needs: buildTestAndAnalyze
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Call deployment hook on Render.com
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOYMENT_HOOK_URL }}
        run: |
          curl --fail-with-body -X POST "$deploy_url"
