name: CI/CD

on:
  push:
  pull_request:
  release:
    types: [created]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Java 25
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Gradle Build
        run: ./gradlew build

      - name: Publish test report
        uses: dorny/test-reporter@v3.0.0
        if: |
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: JUnit Tests
          path: backend/build/test-results/test/*.xml
          reporter: java-junit

  trigger-deployment:
    name: Trigger Deployment to Render.com
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Call deployment hook on Render.com
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOYMENT_HOOK_URL }}
        run: |
          curl --fail-with-body -X POST "$deploy_url"
